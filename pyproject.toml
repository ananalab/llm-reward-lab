[project]
name = "reward-lab"
version = "0.1.0"
description = "LLM-written reward functions for MuJoCo Playground tasks, with text vs. visual feedback."
requires-python = ">=3.10"
dependencies = [
    "playground==0.2.0",
    "jax==0.8.0",
    "jaxlib==0.8.0",
    "pyyaml",
    "numpy",
    "pillow",
    "imageio",
    "matplotlib",
    "requests",
    "scipy",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]==0.8.0"]
dev = ["pytest", "kaggle"]

[project.scripts]
reward-lab = "reward_lab.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
